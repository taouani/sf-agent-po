name: Release next

# Publishes the v1 pre-release to npm as sf-agent-po@next. It runs only when someone with
# write access starts it from the Actions tab, on main; nothing publishes on push or merge.
# The job runs in the "npm-next" environment: give it required reviewers (Settings >
# Environments) so each publish also waits for an approval.
# It publishes through npm trusted publishing: npm trusts this workflow, in this environment,
# through GitHub's OIDC token, so no npm token is needed (npmjs.com, package Settings >
# Trusted publishing > GitHub Actions: user taouani, repository sf-agent-po, workflow
# release-next.yml, environment npm-next). Until that is set up, an NPM_TOKEN secret in the
# environment is used instead; npm tries trusted publishing first, so the secret can be
# deleted once a release has gone out without it.
# Each release also moves the "latest" tag to it, so that npx sf-agent-po without @next runs
# the newest pre-release (decision D5 of the phase 5 plan) until 1.0.
# The version is the one in packages/mcp/package.json: bump it in a pull request before
# each release, since npm never accepts the same version twice.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build, check and pack, but do not publish"
        type: boolean
        default: true
      provenance:
        description: "Sign the package with npm provenance (untick only while Sigstore's transparency log is down)"
        type: boolean
        default: true

permissions:
  contents: read
  # For npm provenance: the package records which workflow run built it.
  id-token: write

concurrency:
  group: release-next
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-next
    # Only from main: what is published is what main holds.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No dependency cache in a job that publishes: everything comes from the registry.
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 24 can come with an older one.
      - name: Update npm
        run: |
          npm install -g npm@11
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing needs"; exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: version
        name: Check the version
        run: |
          version=$(node -p "require('./packages/mcp/package.json').version")
          case "$version" in
            *[!0-9A-Za-z.-]*) echo "::error::$version holds characters a version cannot"; exit 1 ;;
            *-next.*) ;;
            *) echo "::error::$version is not a next pre-release (x.y.z-next.n)"; exit 1 ;;
          esac
          if npm view "sf-agent-po@$version" version > /dev/null 2>&1; then
            echo "::error::sf-agent-po@$version is already on npm: bump the version in packages/mcp/package.json"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: node scripts/pack-next.mjs --smoke --smoke-server
      # Values reach the scripts through the environment, never inside them.
      # Provenance is signed before anything is uploaded, and Sigstore's transparency log
      # sometimes answers 500 (TLOG_CREATE_ENTRY_ERROR). Such errors, and npm's own 5xx and
      # network errors, are tried again, three attempts in all; any other error stops at once.
      # A failed attempt counts as done when npm shows this very tarball under the version
      # (checked after a wait, since the registry can take a moment to show it).
      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          # Empty once the secret is deleted: npm then relies on trusted publishing alone.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          set -o pipefail
          tarball=".pack-next/sf-agent-po-$VERSION.tgz"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          published() { [ "$(npm view "sf-agent-po@$VERSION" dist.integrity 2>/dev/null)" = "$integrity" ]; }
          # An explicit false: npm would otherwise turn provenance on by itself under trusted publishing.
          set -- "$tarball" --tag next --access public --provenance="$PROVENANCE"
          log=$(mktemp)
          for attempt in 1 2 3; do
            if npm publish "$@" 2>&1 | tee "$log"; then exit 0; fi
            if ! grep -Eq 'TLOG_CREATE_ENTRY_ERROR|code E5[0-9][0-9]|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up' "$log"; then
              if published; then echo "sf-agent-po@$VERSION is on npm"; exit 0; fi
              if grep -Eq 'code E401|code E403|code ENEEDAUTH|code EOTP' "$log"; then
                echo "::error::npm refused the publish. Check the trusted publisher on npmjs.com (user taouani, repository sf-agent-po, workflow release-next.yml, environment npm-next), or add an NPM_TOKEN secret to the npm-next environment"
              else
                echo "::error::npm publish failed with an error that trying again would not fix: see the npm error above"
              fi
              exit 1
            fi
            echo "Attempt $attempt failed with an error that can pass; waiting $((attempt * 60)) s"
            sleep $((attempt * 60))
            if published; then echo "sf-agent-po@$VERSION is on npm"; exit 0; fi
          done
          hint="run again later"
          if [ "$PROVENANCE" = "true" ]; then hint="$hint, or untick provenance"; fi
          echo "::error::The publish failed three times. If the error is TLOG_CREATE_ENTRY_ERROR, Sigstore's transparency log is down (https://status.sigstore.dev): $hint."
          exit 1
      # Until 1.0, "latest" follows "next", so that npx sf-agent-po without a tag does not run
      # an old pre-release. Once a release without -next is latest, it is left alone. A failure
      # here does not undo the publish: the summary says how to move the tag by hand.
      - name: Move the latest tag
        id: latest
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          current=$(npm view sf-agent-po dist-tags.latest 2>/dev/null || true)
          case "$current" in
            *-next.*|"") ;;
            *) echo "latest is $current, a release: left as it is"; echo "moved=kept" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if npm dist-tag add "sf-agent-po@$VERSION" latest; then
            echo "moved=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::sf-agent-po@$VERSION is published, but the latest tag could not be moved to it. Run: npm dist-tag add sf-agent-po@$VERSION latest"
            echo "moved=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
          PROVENANCE: ${{ inputs.provenance }}
          LATEST: ${{ steps.latest.outputs.moved }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: sf-agent-po@$VERSION was built and checked, not published." >> "$GITHUB_STEP_SUMMARY"
          else
            note=""; if [ "$PROVENANCE" != "true" ]; then note=" (without provenance)"; fi
            echo "Published sf-agent-po@$VERSION with the tag next$note: https://www.npmjs.com/package/sf-agent-po" >> "$GITHUB_STEP_SUMMARY"
            case "$LATEST" in
              yes) echo "The latest tag now points to it too." >> "$GITHUB_STEP_SUMMARY" ;;
              no) echo "The latest tag could not be moved: run npm dist-tag add sf-agent-po@$VERSION latest" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          fi
