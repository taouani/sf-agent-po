name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Also saves and reads a key with the runner's real keychain (or the key file fallback).
      SF_AGENT_PO_KEYCHAIN_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Secret Service on Linux, with an unlocked GNOME Keyring on a private D-Bus session.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libsecret-tools gnome-keyring
      - if: runner.os == 'Linux'
        env:
          SF_AGENT_PO_SECRET_SERVICE: "1"
        run: |
          dbus-run-session -- sh -c 'echo ci-keyring | gnome-keyring-daemon --unlock --components=secrets > /dev/null && npx vitest run packages/core/test/keychain.test.ts'
      # The approval page in a real browser: forms are posted the way Chromium posts them.
      - if: runner.os == 'Linux'
        run: npx playwright-core install --with-deps chromium-headless-shell
      - if: runner.os == 'Linux'
        env:
          SF_AGENT_PO_BROWSER_TEST: "1"
        run: npx vitest run packages/mcp/test/browser.test.ts

  # The detection model on the bundled WebAssembly runtime, with the real model files
  # (138 MB, downloaded from Hugging Face once and cached).
  model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SF_AGENT_PO_MODEL_TEST: "1"
      SF_AGENT_PO_MODEL_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The cache key is the pinned revision, so only a model change downloads it again.
      - id: model
        shell: bash
        run: |
          echo "revision=$(grep -o 'revision: "[0-9a-f]*"' packages/core/src/masking/model/files.ts | grep -o '[0-9a-f]\{40\}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: detection-model-${{ steps.model.outputs.revision }}
      - run: npm test -- packages/core/test/masking-model.test.ts
